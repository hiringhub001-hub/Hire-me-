name: CI

on:
  push:
    branches: [main, deployment]
  pull_request:

env:
  DATABASE_URL: postgresql://careerhub:careerhub@localhost:5432/careerhub?schema=public
  AUTH_SECRET: ci-secret-value-at-least-32-characters-long
  NEXT_PUBLIC_SITE_URL: http://localhost:3000

jobs:
  quality:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: careerhub
          POSTGRES_PASSWORD: careerhub
          POSTGRES_DB: careerhub
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run typecheck
      - run: npm run lint
      - run: npx next build

  tests:
    name: Journey and layout tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: careerhub
          POSTGRES_PASSWORD: careerhub
          POSTGRES_DB: careerhub
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_BASE_URL: http://localhost:3200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npx next build

      - name: Start server
        run: npx next start -p 3200 &

      - name: Wait for server
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:3200 > /dev/null && exit 0
            sleep 1
          done
          echo "Server did not start in time" && exit 1

      - run: npm run test:e2e
      - run: npm run test:layout
