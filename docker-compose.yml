# Local PostgreSQL, so development runs against the same database engine as
# production. Start it with `npm run db:up`.
services:
  postgres:
    image: postgres:16-alpine
    container_name: careerhub-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: careerhub
      POSTGRES_PASSWORD: careerhub
      POSTGRES_DB: careerhub
    ports:
      - '5432:5432'
    volumes:
      - careerhub-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U careerhub']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  careerhub-pgdata:
